  <style>
    :root {
      --paper: #ffffff; --bg: #f3f6fc; --surface: #f1f4fa; --line: #dce3ef; --ink: #0f172a; --muted: #5b6478;
      --brand: #1e3a8a; --brand2: #4f46e5; --brand-soft: #eef2ff; --brand-line: #c7d2fe;
      --plate: #f5c518; --plate-ink: #141414; --ok: #15803d; --ok-bg: #e7f6ec;
      --err: #b91c1c; --err-bg: #fdecec; --focus: #4f46e5;
      --grad: linear-gradient(135deg, #1e3a8a 0%, #4f46e5 100%);
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.05);
      --radius-lg: 16px; --radius-sm: 10px;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; max-width: 100%; overflow-x: hidden; }
    body {
      font-family: 'Hind', 'Noto Sans', 'Noto Sans Devanagari', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: var(--ink); font-size: 17px; line-height: 1.45; -webkit-text-size-adjust: 100%;
      background-color: var(--bg);
      background-image:
        radial-gradient(600px 220px at 90% 0%, rgba(56, 189, 248, 0.35), transparent 70%),
        linear-gradient(135deg, #0b1e5b 0%, #1e3a8a 45%, #4f46e5 100%);
      background-repeat: no-repeat;
      background-size: 100% 270px, 100% 270px;
    }
    body.modal-open { overflow: hidden; }

    /* Top brand bar (on the blue band) */
    .brandbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 18px; flex-wrap: wrap; }
    .brand {
      display: inline-flex; align-items: center;
      padding: 7px 12px; background: #ffffff; border-radius: 12px;
      box-shadow: 0 6px 18px rgba(2, 6, 23, 0.25);
    }
    .brand img { display: block; height: 28px; width: auto; }
    .brand-right { display: flex; align-items: center; gap: 8px; }
    .brand-tag {
      color: #ffffff; font-weight: 700; font-size: 0.92rem; letter-spacing: 0.02em;
      padding: 6px 12px; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 999px;
      background: rgba(255, 255, 255, 0.10); white-space: nowrap;
    }
    .lang {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 6px 4px 10px; border: 1px solid rgba(255, 255, 255, 0.45); border-radius: 999px;
      background: rgba(255, 255, 255, 0.14); color: #ffffff;
    }
    .lang svg { width: 18px; height: 18px; flex: 0 0 18px; }
    .lang select {
      appearance: none; -webkit-appearance: none; border: 0; background: transparent; color: #ffffff;
      font-family: inherit; font-size: 0.95rem; font-weight: 700; padding: 4px 18px 4px 2px; cursor: pointer;
      background-image: linear-gradient(45deg, transparent 50%, #fff 50%), linear-gradient(135deg, #fff 50%, transparent 50%);
      background-position: right 6px center, right 1px center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
    }
    .lang select option { color: var(--ink); }
    .lang select:focus { outline: 2px solid #ffffff; outline-offset: 2px; border-radius: 6px; }
    @media (max-width: 520px) { .brand-tag { display: none; } }

    /* White cards on the band */
    #formView, .done, #linkView, #loginView, .report, .boot {
      background: var(--paper); border-radius: 18px; padding: 22px 18px;
      box-shadow: var(--shadow);
    }
    .foot { margin: 26px 0 0; text-align: center; color: var(--muted); font-size: 0.82rem; }
    main { max-width: 520px; margin: 0 auto; padding: 20px 18px 40px; }
    main.wide { max-width: 1240px; }

    /* Paster: form + report side by side on wide screens, tabs on phones */
    .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
    .layout > * { min-width: 0; }   /* never let wide content push the page wider than the phone */
    .pane-tabs { display: flex; gap: 6px; margin: 0 0 18px; }
    .pane-tab {
      flex: 1; min-height: 46px; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 999px;
      background: rgba(255, 255, 255, 0.12); color: #ffffff;
      font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    .pane-tab[aria-selected="true"] { background: #ffffff; color: var(--brand); border-color: #ffffff; box-shadow: 0 6px 16px rgba(2, 6, 23, 0.2); }
    #appView.tab-form #reportPane, #appView.tab-report #formPane { display: none; }
    #appView.vendor-mode #formPane, #appView.vendor-mode .pane-tabs { display: none !important; }
    #appView.vendor-mode #reportPane { display: block !important; }
    @media (min-width: 1000px) {
      #appView.paster-mode .layout { grid-template-columns: minmax(340px, 460px) minmax(0, 1fr); align-items: start; }
      #appView.paster-mode .pane-tabs { display: none; }
      #appView.paster-mode #formPane, #appView.paster-mode #reportPane { display: block !important; }
      #reportPane { position: sticky; top: 12px; }
    }

    /* Report */
    .rep-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .rep-head h2 { margin: 0; font-size: 1.25rem; color: var(--brand); }
    .seg { display: flex; width: 100%; max-width: 520px; padding: 4px; margin: 14px 0 12px; border-radius: 999px; background: var(--brand-soft); }
    .seg button {
      flex: 1; min-height: 38px; padding: 4px 6px; border: 0; border-radius: 999px; background: transparent; white-space: nowrap;
      color: var(--ink); font-family: inherit; font-size: 0.92rem; font-weight: 600; cursor: pointer;
    }
    .seg button[aria-selected="true"] { background: var(--grad); color: #ffffff; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
    table.rep { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    table.rep th, table.rep td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
    table.rep th { background: #f5f7ff; color: var(--brand); font-weight: 700; vertical-align: bottom; }
    table.rep th small { display: block; font-weight: 400; color: var(--muted); font-size: 0.78rem; }
    table.rep td:first-child, table.rep th:first-child { text-align: left; position: sticky; left: 0; background: var(--paper); }
    table.rep th:first-child { background: #f5f7ff; }
    table.rep tr.total td { font-weight: 700; }
    table.rep tr.group td { background: var(--brand-soft); font-weight: 700; text-align: left; font-size: 0.85rem; color: var(--brand); }
    table.rep tr:last-child td { border-bottom: 0; }
    .num {
      min-width: 42px; min-height: 32px; padding: 2px 8px; border: 0; border-radius: 6px;
      background: transparent; color: var(--brand2); font-family: inherit; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
    }
    .num:hover, .num:focus-visible { background: var(--brand-soft); outline: none; }
    .num.sel { background: var(--plate); color: var(--plate-ink); text-decoration: none; }
    .zero { color: var(--muted); }
    a.dl {
      display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 16px; border-radius: 999px;
      background: var(--grad); color: #ffffff; font-weight: 700; font-size: 0.92rem; text-decoration: none;
      box-shadow: 0 6px 14px rgba(79, 70, 229, 0.28);
    }
    a.dl[aria-disabled="true"] { opacity: 0.5; pointer-events: none; }
    a.dl svg { width: 18px; height: 18px; }
    table.rows { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    table.rows th, table.rows td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    table.rows th { background: #f5f7ff; color: var(--brand); font-weight: 700; position: sticky; top: 0; }
    table.rows tr:last-child td { border-bottom: 0; }
    table.rows a { color: var(--focus); }
    .plate-chip {
      display: inline-block; padding: 1px 8px 0; background: var(--plate); color: var(--plate-ink);
      border: 1.5px solid var(--plate-ink); border-radius: 5px; font-weight: 700; letter-spacing: 0.04em;
    }

    /* Filter box */
    .filters {
      margin: 22px 0 0; padding: 16px; border: 1px solid var(--brand-line); border-radius: var(--radius-lg);
      background: linear-gradient(180deg, #f8faff 0%, #ffffff 100%);
    }
    .filters h3 { margin: 0 0 10px; font-size: 1.05rem; color: var(--brand); }
    .fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; align-items: end; }
    .fgrid label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
    .fgrid input, .fgrid select {
      min-height: 42px; padding: 6px 10px; border: 2px solid var(--line); border-radius: var(--radius-sm);
      background: var(--paper); color: var(--ink); font-family: inherit; font-size: 0.95rem; width: 100%;
    }
    .fgrid input:focus, .fgrid select:focus { outline: 3px solid var(--focus); outline-offset: 1px; border-color: var(--ink); }
    .fbtn {
      min-height: 42px; padding: 6px 16px; border: 0; border-radius: var(--radius-sm);
      background: var(--grad); color: #ffffff; font-family: inherit; font-size: 0.95rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 6px 14px rgba(79, 70, 229, 0.28);
    }
    .fbtn:disabled { opacity: 0.6; cursor: wait; }

    header h1 { font-size: 1.45rem; font-weight: 700; line-height: 1.2; margin: 0 0 2px; color: var(--brand); }
    header p { margin: 0 0 22px; color: var(--muted); font-size: 0.95rem; }

    fieldset, .field { border: 0; padding: 0; margin: 0 0 24px; }
    legend, .title { display: block; font-weight: 600; font-size: 1.02rem; margin-bottom: 8px; padding: 0; }
    .sub { color: var(--muted); font-weight: 400; font-size: 0.9rem; }
    .req { color: var(--err); font-weight: 700; }

    fieldset.invalid .tile span { border-color: var(--err); background: var(--err-bg); }
    .plate.invalid { border-color: var(--err); box-shadow: 0 0 0 2px var(--err); }
    .capture.invalid { border-color: var(--err); background: var(--err-bg); }
    .field-err { display: none; margin: 6px 2px 0; font-size: 0.88rem; font-weight: 600; color: var(--err); }
    .field-err.show { display: block; }

    .login-card { margin-top: 12px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 8px 4px; }
    .login-card .lwho { margin: 0; font-size: 1.02rem; line-height: 1.55; }
    .login-card .lwho strong { color: var(--brand, #1e3a8a); word-break: break-all; }
    #gBtn { min-height: 44px; display: flex; justify-content: center; }
    .login-card .err { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px; background: #fdecec; color: #b91c1c; font-weight: 600; }
    .login-card .inapp { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px; background: #fff8e1; border-left: 4px solid var(--plate); text-align: left; display: flex; flex-direction: column; gap: 10px; }
    .login-card .inapp a, .login-card .inapp button { min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-weight: 700; text-decoration: none; font-family: inherit; font-size: 1rem; }
    .login-card .inapp a { background: var(--brand, #1e3a8a); color: #ffffff; }
    .login-card .inapp button { background: #ffffff; color: var(--brand, #1e3a8a); border: 1px solid #c7d2fe; }
    .login-card .switch { background: none; border: 0; color: var(--brand2, #4f46e5); text-decoration: underline; font-family: inherit; font-size: 0.95rem; cursor: pointer; }
    .login-card small { color: var(--muted, #4b5568); }
    .notice { margin-top: 12px; padding: 14px; border-radius: var(--radius-sm); background: #fff8e1; border-left: 4px solid var(--plate); }
    .boot { text-align: center; padding: 60px 18px; color: var(--muted); }

    .who {
      display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 6px 14px;
      padding: 12px 14px; margin: 0 0 22px;
      border: 1px solid var(--brand-line); border-radius: var(--radius-lg);
      background: linear-gradient(135deg, #eef2ff 0%, #f0f9ff 100%);
    }
    .who-label { display: block; font-size: 0.85rem; color: var(--muted); }
    .who strong { font-size: 1.2rem; line-height: 1.25; color: var(--brand); }
    .who-mail { font-size: 0.88rem; color: var(--muted); text-align: right; word-break: break-all; }

    .loc-line {
      display: flex; align-items: flex-start; gap: 8px;
      margin: -10px 0 22px; padding: 10px 12px;
      border-radius: var(--radius-sm); background: var(--surface);
      font-size: 0.9rem; color: var(--muted);
    }
    .loc-line.ok { color: var(--ok); background: var(--ok-bg); }
    .loc-line.bad { color: var(--err); background: var(--err-bg); }
    .loc-line svg { flex: 0 0 18px; width: 18px; height: 18px; margin-top: 2px; }

    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tile input { position: absolute; opacity: 0; pointer-events: none; }
    .tile span {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 64px; padding: 10px;
      border: 2px solid var(--line); border-radius: var(--radius-sm); background: var(--paper);
      font-weight: 600; text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
    }
    .tile small { font-weight: 400; color: var(--muted); }
    .tile input:checked + span { border-color: var(--brand2); background: var(--brand-soft); color: var(--brand); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
    .tile input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }

    .plate { display: flex; align-items: stretch; background: var(--plate); border: 3px solid var(--plate-ink); border-radius: 10px; overflow: hidden; }
    .plate .ind {
      display: flex; align-items: center; padding: 0 10px;
      font-weight: 700; font-size: 0.8rem; color: var(--plate-ink); border-right: 2px solid var(--plate-ink);
    }
    .plate input {
      flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; color: var(--plate-ink);
      font-family: inherit; font-weight: 700; font-size: 1.7rem; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 10px 12px 6px; text-align: center;
    }
    .plate input::placeholder { color: rgba(20, 20, 20, 0.35); }
    .plate input:focus { outline: none; }
    .plate:focus-within { outline: 3px solid var(--focus); outline-offset: 3px; }
    .hint { margin: 6px 2px 0; font-size: 0.88rem; color: var(--muted); }
    .hint.bad { color: var(--err); }
    .hint.good { color: var(--ok); }

    /* Capture box: the real camera input sits on top of it, so a tap always opens the camera */
    .capture {
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      width: 100%; min-height: 150px; padding: 16px;
      border: 2px dashed var(--brand-line); border-radius: var(--radius-lg);
      background: linear-gradient(180deg, #f8faff 0%, #eef2ff 100%);
      color: var(--brand); font-size: 1rem; text-align: center; cursor: pointer;
    }
    .capture input[type=file] {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer; font-size: 0;
    }
    .capture:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
    .capture svg { width: 36px; height: 36px; color: var(--brand2); }
    .capture strong { font-weight: 600; }
    .capture .sub { font-size: 0.85rem; }

    .preview { position: relative; border-radius: var(--radius-lg); overflow: hidden; border: 2px solid var(--line); background: #000; }
    .preview img, .preview video { display: block; width: 100%; max-height: 340px; object-fit: contain; }
    .row-actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .mini {
      position: relative; overflow: hidden;
      display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 6px 14px;
      border: 2px solid var(--line); border-radius: 999px; background: var(--paper);
      color: var(--ink); font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    .mini input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }

    button.submit {
      width: 100%; min-height: 56px; border: 0; border-radius: var(--radius-lg);
      background: var(--grad); color: #ffffff;
      font-family: inherit; font-size: 1.1rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 10px 22px rgba(79, 70, 229, 0.32);
    }
    button.submit:disabled { opacity: 0.55; cursor: not-allowed; }
    button.submit:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    .status { display: none; margin-top: 14px; padding: 12px 14px; border-radius: var(--radius-sm); font-size: 0.95rem; }
    .status.show { display: block; }
    .status.err { background: var(--err-bg); color: var(--err); }
    .status.busy { background: var(--brand-soft); color: var(--brand); }
    .admin-note { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: #fff8e1; border-left: 4px solid var(--plate); font-size: 0.92rem; font-weight: 600; }
    .upbar { margin-top: 10px; height: 12px; border-radius: 999px; background: #ffffff; overflow: hidden; }
    .upbar i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #1e3a8a, #4f46e5); transition: width .25s; }
    .upbar.wait i { width: 100% !important; background: linear-gradient(90deg, #4f46e5 0%, #a5b4fc 50%, #4f46e5 100%); background-size: 200% 100%; animation: upwait 1.2s linear infinite; }
    @keyframes upwait { from { background-position: 200% 0; } to { background-position: 0 0; } }
    .uprow { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
    .status.ok { background: var(--ok-bg); color: var(--ok); }

    .done { display: none; text-align: center; padding: 40px 10px; }
    .done.show { display: block; }
    .done .tick {
      width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%;
      background: var(--ok-bg); color: var(--ok);
      display: flex; align-items: center; justify-content: center;
    }
    .done h2 { margin: 0 0 6px; font-size: 1.3rem; }
    .done .plate-echo {
      display: inline-block; margin: 10px 0 6px; padding: 4px 14px 0;
      background: var(--plate); color: var(--plate-ink); border: 2px solid var(--plate-ink); border-radius: 8px;
      font-weight: 700; font-size: 1.3rem; letter-spacing: 0.08em;
    }
    .done p { color: var(--muted); margin: 6px 0 24px; }

    /* Entries saved on the phone, waiting for network */
    .pending {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px;
      margin: 0 0 14px; padding: 12px 14px; border-radius: 14px;
      background: #fff7ed; border: 1px solid #fdba74; color: #9a3412; font-size: 0.95rem; font-weight: 600;
    }
    .pending.ok { background: var(--ok-bg); border-color: #86efac; color: var(--ok); }
    .pending small { display: block; font-weight: 400; color: #9a3412; }
    .pending .mini { min-height: 38px; }

    /* Photo viewer (opens inside the app, no Google account prompt) */
    .pview { position: fixed; inset: 0; z-index: 80; background: rgba(2, 6, 23, 0.92); display: flex; flex-direction: column; }
    .pview .pbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; color: #ffffff; }
    .pview .pbar .plate-chip { font-size: 1.05rem; }
    .pview .round { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.16); color: #ffffff; font-size: 1.5rem; line-height: 1; cursor: pointer; }
    .pview .pimg { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 6px; color: #cbd5e1; text-align: center; }
    .pview .pimg img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
    .pview .pfoot { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); }
    .pview .pfoot > * { flex: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-weight: 700; text-decoration: none; }
    .pview .pfoot .nav { border: 1px solid rgba(255,255,255,0.35); background: transparent; color: #ffffff; font-family: inherit; font-size: 1.2rem; cursor: pointer; }
    .pview .pfoot .nav:disabled { opacity: 0.35; }
    .pview .pfoot .dl { background: #ffffff; color: var(--brand); }
    .photo-link { background: none; border: 0; padding: 0; color: var(--brand2, #4f46e5); font-family: inherit; font-size: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }

    /* Pop-ups */
    .modal-back {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center; padding: 16px;
      background: rgba(15, 23, 42, 0.55);
    }
    .modal {
      display: flex; flex-direction: column; width: 100%; max-width: 480px; max-height: calc(100vh - 32px);
      background: var(--paper); border-radius: 18px; box-shadow: 0 24px 60px rgba(2, 6, 23, 0.35);
    }
    .modal.wide { max-width: 1000px; }
    .modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .modal-head h3 { flex: 1; margin: 0; font-size: 1.08rem; line-height: 1.3; color: var(--brand); }
    .modal-icon {
      flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; background: var(--err-bg); color: var(--err);
    }
    .modal-icon svg { width: 22px; height: 22px; }
    .modal-x {
      flex: 0 0 38px; width: 38px; height: 38px; border: 0; border-radius: 50%;
      background: var(--surface); color: var(--ink); font-size: 1.3rem; line-height: 1; cursor: pointer;
    }
    .modal-x:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .modal-body { padding: 16px 18px; overflow: auto; }
    .modal-body ol { margin: 10px 0 0; padding-left: 22px; }
    .modal-body li { margin: 6px 0; }
    .modal-reason { margin: 0 0 6px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--err-bg); color: var(--err); font-weight: 600; }
    .modal-foot {
      display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 10px;
      padding: 12px 18px; border-top: 1px solid var(--line);
    }
    .modal-foot .note { flex: 1; min-width: 180px; margin: 0; color: var(--muted); font-size: 0.88rem; }
    @media (max-width: 600px) {
      .modal-back { padding: 0; align-items: flex-end; }
      .modal, .modal.wide { max-width: none; max-height: 92vh; border-radius: 18px 18px 0 0; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .done.show .tick { animation: pop 0.35s ease-out; }
      .modal-back:not([hidden]) .modal { animation: rise 0.2s ease-out; }
      @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    }
  </style>
</head>

  var LANG_KEY = 'tb_lang';

  /* ───── Talking to the Apps Script (config.js sets TB_API_URL) ───── */
  var API_URL = window.TB_API_URL || '';
  var SESSION = '';
  function api(action, payload) {
    if (!API_URL) return Promise.reject(Object.assign(new Error('API link missing in config.js'), { server: true }));
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // plain text = no extra permission request
      body: JSON.stringify(Object.assign({ action: action, session: SESSION }, payload || {})),
      redirect: 'follow'
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.ok) throw Object.assign(new Error((j && j.error) || 'Server error'), { server: true });
      return j.data;
    });
    // A network failure (no internet) rejects WITHOUT err.server, so callers can tell the two apart
  }
  /* Same as api(), but reports upload progress (used for the photo / video submit) */
  function apiUpload(action, payload, onPct) {
    if (!API_URL) return Promise.reject(Object.assign(new Error('API link missing in config.js'), { server: true }));
    return new Promise(function (resolve, reject) {
      var x = new XMLHttpRequest();
      x.open('POST', API_URL, true);
      x.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');
      x.upload.onprogress = function (e) { if (e.lengthComputable && onPct) onPct(Math.min(98, Math.round(e.loaded * 100 / e.total))); };
      x.upload.onload = function () { if (onPct) onPct(99); };   // all sent → "saving the entry…"
      x.onload = function () {
        var j = null;
        try { j = JSON.parse(x.responseText); } catch (e) {}
        if (!j) return reject(new Error('network'));
        if (!j.ok) return reject(Object.assign(new Error(j.error || 'Server error'), { server: true }));
        resolve(j.data);
      };
      x.onerror = function () { reject(new Error('network')); };   // no err.server → treated as "no internet"
      x.ontimeout = x.onerror;
      x.timeout = 120000;
      x.send(JSON.stringify(Object.assign({ action: action, session: SESSION }, payload || {})));
    });
  }

  function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  function recall(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }

  /* ───── Language ───── */
  function pickLang() {
    var saved = '';
    try { saved = localStorage.getItem(LANG_KEY) || ''; } catch (e) {}
    var codes = LANGS.map(function (l) { return l[0]; });
    if (codes.indexOf(saved) !== -1) return saved;
    // First visit: Hindi, unless the phone is set to one of the regional languages
    var nav = String((navigator.language || 'hi')).slice(0, 2).toLowerCase();
    return ['kn', 'ta', 'te', 'mr', 'bn'].indexOf(nav) !== -1 ? nav : 'hi';
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(function (n) { n.textContent = t(n.getAttribute('data-i18n')); });

  /* ───── Photo viewer: Drive photo shown inside the app ───── */
  var pv = { list: [], i: 0 };
  function driveId(u) {
    var m = /\/d\/([^/?#]+)/.exec(u || '') || /[?&]id=([^&#]+)/.exec(u || '');
    return m ? m[1] : '';
  }
  function openPhoto(list, i) {
    pv.list = list || pv.list;
    pv.i = Math.max(0, Math.min(pv.list.length - 1, i));
    var r = pv.list[pv.i];
    var id = driveId(r.photo);
    el('pPlate').textContent = r.vehicle || '';
    el('pCount').textContent = (pv.i + 1) + ' / ' + pv.list.length;
    el('pDl').href = id ? 'https://drive.google.com/uc?export=download&id=' + encodeURIComponent(id) : (r.photo || '#');
    var box = el('pImg');
    box.textContent = t('photoLoading');
    if (id) {
      var img = new Image();
      img.alt = r.vehicle || '';
      img.referrerPolicy = 'no-referrer';
      img.onload = function () { box.innerHTML = ''; box.appendChild(img); };
      img.onerror = function () { box.textContent = t('photoFail'); };
      img.src = 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w1600';
    } else {
      box.textContent = t('photoFail');
    }
    el('pPrev').disabled = pv.i === 0;
    el('pNext').disabled = pv.i >= pv.list.length - 1;
    el('pView').hidden = false;
  }
  function closePhoto() { el('pView').hidden = true; }
  (function () {
    var x0 = null, y0 = null;
    el('pView').addEventListener('touchstart', function (e) { var p = e.touches[0]; x0 = p.clientX; y0 = p.clientY; }, { passive: true });
    el('pView').addEventListener('touchend', function (e) {
      if (x0 === null) return;
      var p = e.changedTouches[0], dx = p.clientX - x0, dy = p.clientY - y0;
      x0 = null;
      if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;

      if (el('pView').hidden) return;

    });
  }

  function onGoogleCredential(cred, code, email) {

  function startPortal(res, code) {

  /* ───── Vehicle number ───── */
  function normaliseVehicle(v) {
    return String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, VEHICLE_MAX_LEN);
  }

  el('vehicle').addEventListener('input', function (e) {
    var clean = normaliseVehicle(e.target.value);
    if (e.target.value !== clean) e.target.value = clean;
    var hint = el('vehicleHint');
    hint.className = 'hint';
    hint.textContent = t('vehicleExample');
    if (clean) setInvalid('vehicle', false);
  });

  document.querySelectorAll('input[name="stickerType"]').forEach(function (r) {
    r.addEventListener('change', function () { setInvalid('sticker', false); });
  });

  /* ───── Required-field checks ───── */
  function setInvalid(field, on) {
    if (field === 'sticker') {
      el('stickerField').classList.toggle('invalid', on);
      el('stickerErr').classList.toggle('show', on);
    } else if (field === 'vehicle') {
      el('plateBox').classList.toggle('invalid', on);
    } else if (field === 'photo') {
      el('photoOpen').classList.toggle('invalid', on);
      el('photoErr').classList.toggle('show', on);
    }
  }

  function validateRequired() {
    var picked = document.querySelector('input[name="stickerType"]:checked');
    var vehicle = normaliseVehicle(el('vehicle').value);
    var missing = [];
    var first = null;

    var stickerOk = !!picked;
    setInvalid('sticker', !stickerOk);
    if (!stickerOk) { missing.push(t('stickerType')); first = first || el('stickerField'); }

    var vehicleOk = vehicle.length > 0;
    setInvalid('vehicle', !vehicleOk);
    if (!vehicleOk) {
      missing.push(t('vehicleNumber'));
      first = first || el('plateBox');
      var hint = el('vehicleHint');
      hint.className = 'hint bad';
      hint.textContent = t('vehicleEnter');
    }

    var photoOk = !!state.photoData;
    setInvalid('photo', !photoOk);
    if (!photoOk) { missing.push(t('truckPhoto')); first = first || el('photoOpen'); }

    if (missing.length) {
      showStatus('err', t('fillRequired') + missing.join(', '));
      if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return null;
    }
    return { stickerType: picked.value, vehicle: vehicle };
  }

  /* ───── Location (lat/long + city, state, pincode) ───── */
  // kind: '' | 'ok' | 'bad'; key: a text key, or text: ready-made text
  function setLocLine(kind, key, text) {
    locView = { kind: kind || '', key: key || '', text: text || '' };
    el('locLine').className = 'loc-line' + (kind ? ' ' + kind : '');
    el('locText').textContent = key ? (key === 'locErr' ? locationErrorText(lastLocErr) : t(key)) : text;
  }

  function locLabel(l) {
    var place = [l.city, l.state].filter(Boolean).join(', ');
    if (l.pincode) place += (place ? ' - ' : '') + l.pincode;
    return (place ? place + '  |  ' : '') + l.lat.toFixed(6) + ', ' + l.lng.toFixed(6);
  }

  // err: null (no browser support) or a GeolocationPositionError
  function locationErrorText(err) {
    if (!navigator.geolocation || err === 'nobrowser') return t('locNoBrowser');
    if (err && err.code === 1) return t('locDenied');
    if (err && err.code === 3) return t('locTimeout');
    return t('locOff');
  }

  // A live GPS watch runs while the form is open. If it gave a reading in the last 20 seconds,
  // Location is ON right now → the submit check passes at once. Switching Location off stops the
  // readings (and raises an error), so the check falls back to a fresh reading and fails.
  var gpsWatch = { id: null, last: 0, pos: null };
  function startGpsWatch() {
    if (!navigator.geolocation || gpsWatch.id !== null) return;
    gpsWatch.id = navigator.geolocation.watchPosition(
      function (pos) { gpsWatch.last = Date.now(); gpsWatch.pos = pos; },
      function () { gpsWatch.last = 0; gpsWatch.pos = null; },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 }
    );
  }
  function locationIsLive() {
    if (gpsWatch.last && Date.now() - gpsWatch.last < 20000) return Promise.resolve();
    return getPosition(true);
  }

  // fresh = true → a live GPS reading right now, so a phone with Location switched off cannot pass
  function getPosition(fresh) {
    // A live watch reading from the last 10 seconds is as good as a new one — and instant
    if (fresh && gpsWatch.pos && Date.now() - gpsWatch.last < 10000) return Promise.resolve(gpsWatch.pos);
    return new Promise(function (resolve, reject) {
      if (!navigator.geolocation) return reject('nobrowser');
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        enableHighAccuracy: true, timeout: 20000, maximumAge: fresh ? 0 : 60000
      });
    });
  }

  function getAddress(lat, lng) {
    var key = lat.toFixed(3) + ',' + lng.toFixed(3);
    if (geoCache[key]) return Promise.resolve(geoCache[key]);
    if (!navigator.onLine) return Promise.resolve({});    // offline: lat/long only, city filled in later
    var call = api('address', { code: link.code, lat: lat, lng: lng })
      .then(function (a) { geoCache[key] = a || {}; return geoCache[key]; }, function () { return {}; });
    var slow = new Promise(function (resolve) { setTimeout(function () { resolve({}); }, 6000); });
    return Promise.race([call, slow]);
  }

  // Fresh GPS fix + address. Resolves with loc, rejects with the geolocation error.
  function refreshLocation(fresh) {
    if (!fresh && loc && Date.now() - loc.time < LOCATION_MAX_AGE_MS && (loc.city || loc.state || loc.pincode)) {
      return Promise.resolve(loc);
    }
    setLocLine('', 'locGetting');
    return getPosition(fresh).then(function (pos) {
      var l = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        acc: Math.round(pos.coords.accuracy || 0),
        time: Date.now(),
        city: '', state: '', pincode: ''
      };
      return getAddress(l.lat, l.lng).then(function (a) {
        l.city = a.city || ''; l.state = a.state || ''; l.pincode = a.pincode || '';
        loc = l;
        lastLocErr = null;
        setLocLine('ok', '', locLabel(l));
        return l;
      });
    }, function (err) {
      lastLocErr = err || 'nobrowser';
      setLocLine(link.locationRequired ? 'bad' : '', 'locErr');
      throw lastLocErr;
    });
  }

  function openLocModal() {
    el('locModalReason').textContent = locationErrorText(lastLocErr);
    openModal('locModal');
  }

  el('locRetry').addEventListener('click', function () {
    var btn = el('locRetry');
    btn.disabled = true;
    btn.textContent = t('locGetting');
    loc = null;
    refreshLocation(true).then(function (l) {
      btn.disabled = false;
      btn.textContent = t('tryAgain');
      closeModal('locModal');
      if (state.photoFile) {
        // Re-stamp the photo already taken, now with location
        drawPhoto(state.photoFile, l, function () { showStatus('ok', t('locFound')); });
      } else {
        hideStatus();
      }
    }, function () {
      btn.disabled = false;
      btn.textContent = t('tryAgain');
      el('locModalReason').textContent = locationErrorText(lastLocErr);
    });
  });

  /* ───── Camera (phone camera app opens when the box is tapped) ───── */
  function isFresh(file) {
    return !file.lastModified || (Date.now() - file.lastModified) < MAX_FILE_AGE_MS;
  }

  document.querySelectorAll('.photoInput').forEach(function (inp) {
    inp.addEventListener('click', hideStatus);
    inp.addEventListener('change', function () {
      var file = inp.files && inp.files[0];
      inp.value = '';
      if (file) handlePhoto(file);
    });
  });

  document.querySelectorAll('.videoInput').forEach(function (inp) {
    inp.addEventListener('click', hideStatus);
    inp.addEventListener('change', function () {
      var file = inp.files && inp.files[0];
      inp.value = '';
      if (file) handleVideo(file);
    });
  });

  function handlePhoto(file) {
    if (!/^image\//.test(file.type || 'image/')) return showStatus('err', t('notPhoto'));
    if (!isFresh(file)) return showStatus('err', t('oldPhoto'));
    showStatus('busy', t('locGetting'));
    refreshLocation(true).then(function (l) {
      drawPhoto(file, l);
    }, function () {
      // Keep the photo; the pop-up asks for location when the paster taps Submit
      drawPhoto(file, null);
    });
  }

  function drawPhoto(file, l, after) {
    showStatus('busy', t('photoPreparing'));
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight;
      var scale = Math.min(1, PHOTO_MAX_SIDE / Math.max(w, h));
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      stampInfo(ctx, canvas.width, canvas.height, l);
      URL.revokeObjectURL(url);

      state.photoFile = file;
      state.photoTime = file.lastModified || Date.now();
      state.photoLoc = l;
      state.photoData = encodeUnder(canvas, PHOTO_MAX_KB * 1024);
      setInvalid('photo', false);
      el('photoPreview').src = state.photoData;
      el('photoOpen').hidden = true;
      el('photoDone').hidden = false;
      hideStatus();
      if (after) after();
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      showStatus('err', t('photoReadFail'));
    };
    img.src = url;
  }

  /* Best-looking JPEG that fits the size limit: lower the quality step by step, and only if
     that is not enough, make the picture a little smaller (1920 → 1600 → 1280 px) */
  function encodeUnder(canvas, maxBytes) {
    var bytes = function (url) { return Math.round((url.length - url.indexOf(',') - 1) * 3 / 4); };
    var qualities = [PHOTO_QUALITY, 0.85, 0.8, 0.75, 0.7, 0.65, 0.6];
    var c = canvas, url = '';
    for (var round = 0; round < 3; round++) {
      for (var i = 0; i < qualities.length; i++) {
        url = c.toDataURL('image/jpeg', qualities[i]);
        if (bytes(url) <= maxBytes) return url;
      }
      var side = [1600, 1280][round];
      if (!side) break;
      var scale = side / Math.max(c.width, c.height);
      if (scale >= 1) continue;
      var smaller = document.createElement('canvas');
      smaller.width = Math.round(c.width * scale);
      smaller.height = Math.round(c.height * scale);
      smaller.getContext('2d').drawImage(c, 0, 0, smaller.width, smaller.height);
      c = smaller;
    }
    return url;   // still the smallest we could make it
  }

  function handleVideo(file) {
    if (!/^video\//.test(file.type || 'video/')) return showStatus('err', t('notVideo'));
    if (!isFresh(file)) return showStatus('err', t('oldVideo'));
    if (file.size > VIDEO_MAX_BYTES) return showStatus('err', t('videoTooBig'));
    var url = URL.createObjectURL(file);
    var probe = document.createElement('video');
    probe.preload = 'metadata';
    probe.onloadedmetadata = function () {
      var secs = probe.duration;
      URL.revokeObjectURL(url);
      if (isFinite(secs) && secs > VIDEO_MAX_SECONDS + 1) {
        return showStatus('err', t('videoTooLong', { s: Math.round(secs), max: VIDEO_MAX_SECONDS }));
      }
      setVideo(file);
    };
    probe.onerror = function () { URL.revokeObjectURL(url); setVideo(file); };
    probe.src = url;
  }

  function setVideo(blob) {
    showStatus('busy', t('videoPreparing'));
    var reader = new FileReader();
    reader.onload = function () {
      state.videoData = reader.result;
      var pv = el('videoPreview');
      if (pv.src && pv.src.indexOf('blob:') === 0) URL.revokeObjectURL(pv.src);
      pv.src = URL.createObjectURL(blob);
      el('videoOpen').hidden = true;
      el('videoDone').hidden = false;
      hideStatus();
    };
    reader.onerror = function () { showStatus('err', t('videoSaveFail')); };
    reader.readAsDataURL(blob);
  }

  // Stamp date-time, lat/long and city/state/pincode on the photo (bottom-left)
  function stampInfo(ctx, w, h, l) {
    var d = new Date();
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var lines = [
      pad(d.getDate()) + '-' + pad(d.getMonth() + 1) + '-' + d.getFullYear() +
        '  ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds())
    ];
    if (l) {
      lines.push('Lat ' + l.lat.toFixed(6) + '  Long ' + l.lng.toFixed(6));
      var place = [l.city, l.state].filter(Boolean).join(', ');
      if (l.pincode) place += (place ? ' - ' : '') + l.pincode;
      if (place) lines.push(place);
    }

    var size = Math.max(14, Math.round(Math.min(w, h) * 0.036));
    var lineH = Math.round(size * 1.35);
    ctx.font = '600 ' + size + 'px sans-serif';
    var tw = 0;
    lines.forEach(function (s) { tw = Math.max(tw, ctx.measureText(s).width); });
    tw = Math.min(tw, w - size * 1.2);

    var padX = Math.round(size * 0.5), padY = Math.round(size * 0.4);
    var boxH = lines.length * lineH + padY * 2;
    var x = Math.round(size * 0.5), y = h - boxH - Math.round(size * 0.5);

    ctx.fillStyle = 'rgba(0,0,0,0.62)';
    ctx.fillRect(x, y, tw + padX * 2, boxH);
    ctx.fillStyle = '#ffffff';
    ctx.textBaseline = 'top';
    lines.forEach(function (s, k) {
      ctx.fillText(s, x + padX, y + padY + k * lineH + Math.round((lineH - size) / 2), tw);
    });
  }

  el('videoRemove').addEventListener('click', clearVideo);

  function clearVideo() {
    state.videoData = '';
    var pv = el('videoPreview');
    if (pv.src && pv.src.indexOf('blob:') === 0) URL.revokeObjectURL(pv.src);
    pv.removeAttribute('src');
    pv.load();
    el('videoDone').hidden = true;
    el('videoOpen').hidden = false;
  }

  function clearPhoto() {
    state.photoData = '';
    state.photoLoc = null;
    state.photoFile = null;
    el('photoPreview').removeAttribute('src');
    el('photoDone').hidden = true;
    el('photoOpen').hidden = false;
  }

  /* ───── Submit ───── */
  el('submitBtn').addEventListener('click', function () {
    if (state.busy) return;

    var ok = validateRequired();
    if (!ok) return;
    var vehicle = ok.vehicle;

    // Location is off → pop-up, nothing is sent
    if (link.locationRequired && !state.photoLoc) {
      hideStatus();
      openLocModal();
      return;
    }

    var entry = {
      entryId: newId(),
      capturedAt: state.photoTime || Date.now(),
      accessCode: link.code,
      stickerType: ok.stickerType,
      vehicleNumber: vehicle,
      photoData: state.photoData,
      videoData: state.videoData,
      location: state.photoLoc ? {
        lat: state.photoLoc.lat, lng: state.photoLoc.lng, acc: state.photoLoc.acc,
        city: state.photoLoc.city, state: state.photoLoc.state, pincode: state.photoLoc.pincode
      } : null
    };

    // No internet → pop-up, nothing is sent or kept; the filled form stays on screen
    if (!navigator.onLine) { hideStatus(); return openModal('netModal'); }

    // Location must still be ON at the moment of submitting (live check)
    if (link.locationRequired) {
      setBusy(true);
      showStatus('busy', t('locChecking'));
      locationIsLive().then(function () { send(); }, function (err) {
        setBusy(false);
        lastLocErr = err || 'nobrowser';
        setLocLine('bad', 'locErr');
        hideStatus();
        openLocModal();
      });
      return;
    }
    send();

    function send() {
    setBusy(true);
    showUpload(0);

    apiUpload('submit', { data: entry }, function (pct) { showUpload(pct); }).then(function (res) {
      setBusy(false);
      hideStatus();
      showDone(vehicle, (res && res.vendor) || link.vendor,
        t('savedOk') + (res && res.duplicate ? ' ' + t('duplicateNote', { h: DUPLICATE_HOURS }) : ''), false);
      loadReport();
    }, function (err) {
      setBusy(false);
      if (!err.server) { hideStatus(); return openModal('netModal'); }   // network dropped mid-way
      var msg = cleanError(err);
      if (msg.indexOf('LOGIN_REQUIRED') !== -1) return loginExpired(link.code);
      if (msg.indexOf('LINK_INVALID') !== -1) return showLinkError(t('notSubmitted'));
      if (msg.indexOf('लोकेशन') !== -1) { hideStatus(); return openLocModal(); }
      showStatus('err', msg || t('submitFail'));
    });
    }
  });

  el('netRetry').addEventListener('click', function () {
    closeModal('netModal');
    el('submitBtn').click();
  });

  function showDone(vehicle, vendor, msg, offline) {
    el('doneVehicle').textContent = vehicle;
    el('doneVendor').textContent = t('vendorPrefix') + (vendor || '');
    el('doneMsg').textContent = msg;
    document.querySelector('#doneView h2').textContent = offline ? t('offlineTitle') : t('doneTitle');
    showView('done');
  }

  /* ───── Offline: entries wait on the phone (IndexedDB) and are sent when the network is back ───── */
  function newId() {
    try { if (crypto.randomUUID) return crypto.randomUUID().replace(/-/g, ''); } catch (e) {}
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
  }

  var DB_NAME = 'tb_app', DB_STORE = 'queue';
  function db() {
    return new Promise(function (resolve, reject) {
      var r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(DB_STORE, { keyPath: 'entryId' }); };
      r.onsuccess = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
    });
  }
  function dbDo(mode, fn) {
    return db().then(function (d) {
      return new Promise(function (resolve, reject) {
        var tx = d.transaction(DB_STORE, mode);
        var out = fn(tx.objectStore(DB_STORE));
        tx.oncomplete = function () { resolve(out && out.result !== undefined ? out.result : out); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }
  function qAll() { return dbDo('readonly', function (st) { return st.getAll(); }); }
  function qPut(item) { return dbDo('readwrite', function (st) { st.put(item); }); }
  function qDel(id) { return dbDo('readwrite', function (st) { st.delete(id); }); }

  function saveOffline(entry, vehicle) {
    var hadVideo = !!entry.videoData;
    entry.videoData = '';                         // videos are too big to keep on the phone
    hideStatus();
    qPut(entry).then(function () {
      showDone(vehicle, link.vendor, t('savedOffline') + (hadVideo ? ' ' + t('offlineNoVideo') : ''), true);
      updatePending();
    }, function () {
      showStatus('err', t('submitFail'));
    });
  }

  var flushing = false, rejected = [];
  function updatePending(sending) {
    qAll().then(function (items) {
      var bar = el('pendingBar');
      var n = items.length;
      if (!n && !rejected.length) { bar.hidden = true; return; }
      bar.hidden = false;
      bar.classList.remove('ok');
      if (n) {
        el('pendingText').textContent = sending ? t('sendingN', { n: n }) : t('pendingN', { n: n });
        el('pendingHint').textContent = t('dontClear');
        el('pendingSend').hidden = !!sending;
      } else {
        el('pendingText').textContent = t('rejectedN', { n: rejected.length, r: rejected[0] });
        el('pendingHint').textContent = '';
        el('pendingSend').hidden = true;
      }
    }).catch(function () {});
  }

  function flushQueue() {
    if (flushing || !navigator.onLine || link.kind !== 'p') return;
    flushing = true;
    qAll().then(function (items) {
      items.sort(function (a, b) { return (a.capturedAt || 0) - (b.capturedAt || 0); });
      var sent = 0;
      var next = function () {
        if (!items.length) {
          flushing = false;
          updatePending();
          if (sent) {
            if (!rejected.length) {
              var bar = el('pendingBar');
              bar.hidden = false; bar.classList.add('ok');
              el('pendingText').textContent = t('allSent'); el('pendingHint').textContent = ''; el('pendingSend').hidden = true;
              setTimeout(function () { updatePending(); }, 4000);
            }
            loadReport();
          }
          return;
        }
        var item = items.shift();
        updatePending(true);
        api('submit', { data: item }).then(function () {
          sent++;
          return qDel(item.entryId).then(next);
        }, function (err) {
          if (!err.server) { flushing = false; updatePending(); return; }     // still offline: try later
          var msg = cleanError(err);
          if (msg.indexOf('LINK_INVALID') !== -1) { flushing = false; return showLinkError(t('notSubmitted')); }
          rejected.push(msg);                                               // the server refused this one: drop it
          return qDel(item.entryId).then(next);
        });
      };
      next();
    }).catch(function () { flushing = false; });
  }

  el('pendingSend').addEventListener('click', flushQueue);
  window.addEventListener('online', function () { setTimeout(flushQueue, 1500); });
  setInterval(flushQueue, 60000);

  el('againBtn').addEventListener('click', function () { resetForm(); });

  function resetForm() {
    document.querySelectorAll('input[name="stickerType"]').forEach(function (r) { r.checked = false; });
    el('vehicle').value = '';
    el('vehicle').dispatchEvent(new Event('input'));
    clearPhoto();
    clearVideo();
    setInvalid('sticker', false);
    setInvalid('vehicle', false);
    setInvalid('photo', false);
    hideStatus();
    showView('form');
  }

  /* ───── Report ───── */
  function hEl(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }

  function setRepSub(res) {
    el('repSub').textContent = (res.kind === 'v' ? t('allPasters') : t('onlyYours', { e: res.email })) +
      ' · ' + t('updated', { t: res.updated });
  }

  function loadReport() {
    var key = 'tb_report_' + link.kind + '_' + link.code;
    if (!report.data) {
      var saved = recall(key);
      if (saved) { report.data = saved; renderReport(); fillFilters(saved); }
    }
    el('repSub').textContent = t('loading');
    api('report', { kind: link.kind, code: link.code }).then(function (res) {
      report.data = res;
      store(key, res);
      setRepSub(res);
      renderReport();
      fillFilters(res);
    }, function (err) {
      var msg = cleanError(err);
      if (err.server && msg.indexOf('LOGIN_REQUIRED') !== -1) return loginExpired(link.code);
      if (err.server && msg.indexOf('LINK_INVALID') !== -1) return showLinkError('');
      if (!err.server && report.data) {
        el('repSub').textContent = t('offlineReport') + ' · ' + t('updated', { t: report.data.updated });
        return;
      }
      el('repSub').textContent = err.server ? t('reportFail') + msg : t('offlineData');
    });
  }

  el('repRefresh').addEventListener('click', loadReport);

  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () {
      report.group = b.getAttribute('data-g');
      document.querySelectorAll('.seg button').forEach(function (x) {
        x.setAttribute('aria-selected', x === b ? 'true' : 'false');
      });
      renderReport();
    });
  });

  function periodLabel(p) { return p.label === 'Today' ? t('today') : (p.label === 'Overall' ? t('overall') : p.label); }

  function renderReport() {
    var d = report.data;
    if (!d) return;
    var g = report.group;
    var periods = d.periods[g];
    var c = d.counts[g];
    var table = el('repTable');
    table.innerHTML = '';

    var headRow = hEl('tr', {}, [hEl('th', { text: '' })]);
    periods.forEach(function (p) {
      headRow.appendChild(hEl('th', {}, [periodLabel(p), hEl('small', { text: p.sub })]));
    });
    table.appendChild(hEl('thead', {}, [headRow]));

    var body = hEl('tbody');
    var addRow = function (label, nums, filter, cls) {
      var tr = hEl('tr', cls ? { class: cls } : {}, [hEl('td', { text: label })]);
      nums.forEach(function (n, i) {
        var td = hEl('td');
        if (n > 0) {
          var btn = hEl('button', { class: 'num', type: 'button', text: String(n) });
          btn.addEventListener('click', function () {
            document.querySelectorAll('.num.sel').forEach(function (x) { x.classList.remove('sel'); });
            btn.classList.add('sel');
            openDetail({
              from: periods[i].from, to: periods[i].to,
              sticker: filter.sticker || '', paster: filter.paster || '',
              title: periodLabel(periods[i]) + ' (' + periods[i].sub + ') · ' + label + ' · ' + n
            });
          });
          td.appendChild(btn);
        } else {
          td.appendChild(hEl('span', { class: 'zero', text: '0' }));
        }
        tr.appendChild(td);
      });
      body.appendChild(tr);
    };

    addRow(t('totalEntries'), c.total, {}, 'total');
    d.types.forEach(function (s) { addRow(t('stickerPrefix') + s, c.byType[s], { sticker: s }); });

    if (d.kind === 'v' && d.pasters.length) {
      body.appendChild(hEl('tr', { class: 'group' }, [hEl('td', { colspan: String(periods.length + 1), text: t('pasterWise') })]));
      d.pasters.forEach(function (e) { addRow(e, c.byPaster[e], { paster: e }); });
    }

    table.appendChild(body);
  }

  /* Pop-up with the entries behind a number / filter, plus download */
  function openDetail(q) {
    el('detTitle').textContent = q.title;
    el('detNote').textContent = t('loading');
    el('detTable').innerHTML = '';
    var dl = el('detDownload');
    dl.removeAttribute('href');
    dl.setAttribute('aria-disabled', 'true');
    openModal('dataModal');

    api('rows', { kind: link.kind, code: link.code, q: { from: q.from, to: q.to, sticker: q.sticker, paster: q.paster, q: q.q || '' } })
      .then(function (res) {
        var tbl = el('detTable');
        tbl.innerHTML = '';
        var cols = [t('colTime'), t('colVehicle'), t('colSticker')];
        if (link.kind === 'v') cols.push(t('pasterLabel'));
        cols = cols.concat([t('colLocation'), t('colPhoto'), t('colVideo'), t('colDup')]);
        tbl.appendChild(hEl('thead', {}, [hEl('tr', {}, cols.map(function (x) { return hEl('th', { text: x }); }))]));

        var body = hEl('tbody');
        if (!res.rows.length) {
          body.appendChild(hEl('tr', {}, [hEl('td', { colspan: String(cols.length), text: t('noRows') })]));
        }
        res.rows.forEach(function (r, k) {
          var place = [r.city, r.state].filter(Boolean).join(', ');
          if (r.pincode) place += (place ? ' - ' : '') + r.pincode;
          var locKids = [place || '—'];
          if (r.map) { locKids.push(' '); locKids.push(hEl('a', { href: r.map, target: '_blank', rel: 'noopener', text: t('map') })); }
          var cells = [
            hEl('td', { text: r.time }),
            hEl('td', {}, [hEl('span', { class: 'plate-chip', text: r.vehicle })]),
            hEl('td', { text: r.sticker })
          ];
          if (link.kind === 'v') cells.push(hEl('td', { text: r.paster || '—' }));
          cells.push(hEl('td', {}, locKids));
          var pb = null;
          if (r.photo) {
            pb = hEl('button', { class: 'photo-link', type: 'button', text: t('colPhoto') });
            pb.addEventListener('click', function () { openPhoto(res.rows, k); });
          }
          cells.push(hEl('td', {}, [pb || '—']));
          cells.push(hEl('td', {}, [r.video ? hEl('a', { href: r.video, target: '_blank', rel: 'noopener', text: t('colVideo') }) : '—']));
          cells.push(hEl('td', { text: r.duplicate ? t('yes') : '' }));
          body.appendChild(hEl('tr', {}, cells));
        });
        tbl.appendChild(body);

        if (res.csvUrl && res.total) {
          dl.href = res.csvUrl;
          dl.removeAttribute('aria-disabled');
        }
        el('detNote').textContent = res.total > res.rows.length
          ? t('shownOf', { n: res.rows.length, t: res.total })
          : t('totalN', { t: res.total });
      }, function (err) {
        el('detNote').textContent = err.server ? t('dataFail') + cleanError(err) : t('offlineData');
      });
  }

  /* ───── Filter box ───── */
  function ymdLocal(d) {
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function fillFilters(d) {
    if (!el('fFrom').value) {
      var today = new Date();
      var from = new Date(); from.setDate(today.getDate() - 6);
      el('fFrom').value = ymdLocal(from);
      el('fTo').value = ymdLocal(today);
    }
    var fill = function (id, list) {
      var sel = el(id), keep = sel.value;
      sel.innerHTML = '';
      sel.appendChild(hEl('option', { value: '', text: t('all') }));
      list.forEach(function (v) { sel.appendChild(hEl('option', { value: v, text: v })); });
      sel.value = keep;
    };
    fill('fSticker', d.types || []);
    if (d.kind === 'v') {
      el('fPasterWrap').hidden = false;
      fill('fPaster', d.pasters || []);
    }
  }

  el('fShow').addEventListener('click', function () {
    var from = el('fFrom').value, to = el('fTo').value;
    if (from && to && from > to) { var tmp = from; from = to; to = tmp; }
    var parts = [(from || t('fromStart')) + ' → ' + (to || t('tillToday'))];
    if (el('fPaster').value && link.kind === 'v') parts.push(el('fPaster').value);
    if (el('fSticker').value) parts.push(t('stickerPrefix') + el('fSticker').value);
    if (el('fText').value.trim()) parts.push('"' + el('fText').value.trim() + '"');
    document.querySelectorAll('.num.sel').forEach(function (x) { x.classList.remove('sel'); });
    openDetail({
      from: from, to: to,
      sticker: el('fSticker').value,
      paster: link.kind === 'v' ? el('fPaster').value : '',
      q: el('fText').value.trim(),
      title: t('filterTitle') + ' · ' + parts.join(' · ')
    });
  });
  el('fText').addEventListener('keydown', function (e) { if (e.key === 'Enter') el('fShow').click(); });

  /* ───── Helpers ───── */
  function setBusy(on) {
    state.busy = on;
    var btn = el('submitBtn');
    btn.disabled = on;
    btn.textContent = on ? t('submitting') : t('submit');
  }
  function showStatus(kind, text) {
    var s = el('status');
    s.className = 'status show ' + kind;
    s.textContent = text;
  }
  /* Upload progress: "% sent" with a bar, then "saving…" with a moving bar until the server answers */
  function showUpload(pct) {
    var s = el('status');
    s.className = 'status show busy';
    s.innerHTML = '';
    var saving = pct >= 99;
    var label = saving ? t('savingEntry') : (state.videoData ? t('uploadingBoth') : t('uploadingPhoto'));
    var row = document.createElement('div');
    row.className = 'uprow';
    var a = document.createElement('span'); a.textContent = label;
    row.appendChild(a);
    if (!saving) { var b = document.createElement('span'); b.textContent = pct + '%'; row.appendChild(b); }
    var bar = document.createElement('div');
    bar.className = 'upbar' + (saving ? ' wait' : '');
    var fill = document.createElement('i');
    fill.style.width = Math.max(3, pct) + '%';
    bar.appendChild(fill);
    s.appendChild(row);
    s.appendChild(bar);
  }

  function hideStatus() {
    var s = el('status');
    s.className = 'status';
    s.textContent = '';
  }

  boot();

  // Keep the app on the phone so it opens without internet
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        try { reg.update(); } catch (e) {}           // look for a newer version on every open
      }).catch(function () {});
    });
  }
</script>
</body>
</html>
